          ORDERS = {
              "OD202605240001": {"status": "已发货", "amount": 299, "product": "无线蓝牙耳机", "can_refund": True},
              "OD202605240002": {"status": "已签收", "amount": 129, "product": "手机壳", "can_refund": True},
              "OD202605240003": {"status": "已签收", "amount": 899, "product": "机械键盘", "can_refund": True},
          }


          def main(query: str, intent: str, order_id: str, complaint_type: str, user_emotion: str, compensation_requested: str, matched_policies: str) -> dict:
              q = query or ""
              order = ORDERS.get(order_id, {})
              amount = int(order.get("amount", 0) or 0)
              status = order.get("status", "")
              score = 0
              reasons = []

              if amount > 500:
                  score += 40
                  reasons.append("amount > 500：+40")
              if user_emotion == "angry":
                  score += 20
                  reasons.append("user_emotion = angry：+20")
              if user_emotion == "urgent":
                  score += 15
                  reasons.append("user_emotion = urgent：+15")
              if "物流" in (complaint_type or ""):
                  score += 10
                  reasons.append("complaint_type 包含物流：+10")
              if "质量" in (complaint_type or q):
                  score += 20
                  reasons.append("complaint_type/用户问题包含质量：+20")
              if compensation_requested == "true":
                  score += 20
                  reasons.append("compensation_requested = true：+20")
              if any(k in q for k in ["赔偿", "补偿", "投诉威胁", "不退就投诉"]):
                  score += 20
                  reasons.append("用户表达赔偿/补偿/投诉威胁：+20")
              if status == "已发货" and intent == "refund":
                  score += 10
                  reasons.append("已发货订单申请退款：+10")

              if score < 30:
                  level = "low"
              elif score < 60:
                  level = "medium"
              else:
                  level = "high"

              return {
                  "risk_score": str(score),
                  "risk_level": level,
                  "risk_reasons": "；".join(reasons) if reasons else "未命中风险加分规则",
              }
