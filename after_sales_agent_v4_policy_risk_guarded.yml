            type: constant
            value:
              completion_params:
                temperature: 0.1
              mode: chat
              model: gpt-4o-mini
              model_type: llm
              provider: langgenius/openai/openai
              type: model-selector
          query:
            type: constant
            value: "{{#sys.query#}}"
          tools:
            type: constant
            value: []
