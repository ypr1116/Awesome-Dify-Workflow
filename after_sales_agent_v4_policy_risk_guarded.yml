          ]


          def main(query: str, intent: str, order_id: str, reason: str, complaint_type: str, user_emotion: str, policy_question: str) -> dict:
              q = query or ""
              order = ORDERS.get(order_id, {})
              status = order.get("status", "")
              amount = order.get("amount", 0)
              matched = []

              if intent == "refund" and status == "已发货":
                  matched.append(POLICIES[0])
              if intent == "refund" and status == "已签收":
                  matched.append(POLICIES[1])
              if intent == "refund" and amount > 500:
                  matched.append(POLICIES[2])
              if any(k in q + reason for k in ["食品", "定制", "虚拟"]):
                  matched.append(POLICIES[3])
              if "物流" in (q + complaint_type):
