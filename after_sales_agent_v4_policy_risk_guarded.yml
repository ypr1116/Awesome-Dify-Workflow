    - data:
        code: |
          import json
          import re


          def _parse(text):
              if not text:
                  return {}
              text = text.strip()
              try:
                  return json.loads(text)
              except Exception:
                  match = re.search(r"{.*}", text, re.S)
                  if match:
                      try:
                          return json.loads(match.group(0))
                      except Exception:
                          return {}
              return {}


          def main(verifier_text: str, draft_reply: str) -> dict:
              data = _parse(verifier_text)
              passed = data.get("pass", True)
              if isinstance(passed, str):
                  passed = passed.lower() == "true"
              revised = data.get("revised_answer") or ""
              issues = data.get("issues", [])
              if passed or not revised:
                  final = draft_reply
                  pass_text = "true"
              else:
                  final = revised
                  pass_text = "false"
              return {
                  "final_reply": final,
                  "verifier_pass": pass_text,
                  "verifier_issues": "; ".join(issues) if isinstance(issues, list) else str(issues),
              }
        code_language: python3
        desc: pass=true 使用 draft_reply，否则使用 revised_answer。
        outputs:
          final_reply:
            children:
            type: string
          verifier_pass:
            children:
            type: string
          verifier_issues:
            children:
            type: string
