    - data:
        code: |
          import json
          import re

          ORDER_PATTERN = re.compile(r"^OD\d{12}$")
          ORDER_CANDIDATE_PATTERN = re.compile(r"OD\w+|\b\d{3,}\b|[a-zA-Z]{3,}")


          def _safe_json(text):
              if not text:
                  return {}
              text = text.strip()
              try:
                  return json.loads(text)
              except Exception:
                  match = re.search(r"\{.*\}", text, re.S)
                  if match:
                      try:
                          return json.loads(match.group(0))
                      except Exception:
                          return {}
              return {}


          def _fallback_intent(query):
              q = query or ""
              if any(k in q for k in ["退款", "退钱", "退货", "能不能退", "可以退"]):
                  return "refund"
              if any(k in q for k in ["投诉", "太慢", "服务差", "不满意", "质量问题", "质量"]):
                  return "complaint"
              if any(k in q for k in ["订单", "物流", "到哪", "状态", "发货", "签收"]):
                  return "query_order"
              return "chitchat"


          def _fallback_emotion(query):
              q = query or ""
              if any(k in q for k in ["生气", "离谱", "投诉威胁", "不退就投诉", "太过分", "愤怒"]):
                  return "angry"
              if any(k in q for k in ["马上", "立刻", "赶紧", "急", "尽快"]):
                  return "urgent"
              return "normal"


          def _fallback_requested_action(query, intent):
              q = query or ""
              if any(k in q for k in ["赔偿", "补偿", "退 1000", "退1000"]):
                  return "compensation"
              if intent == "refund":
                  return "refund"
              if intent == "complaint":
                  return "complaint"
              if intent == "query_order":
                  return "query"
              if any(k in q for k in ["政策", "能不能", "支持", "七天无理由"]):
                  return "consult"
              return "other"


          def _bool_text(value, default="false"):
              if isinstance(value, bool):
                  return "true" if value else "false"
              if value is None or value == "":
                  return default
              value = str(value).strip().lower()
              return "true" if value in ["true", "1", "yes", "是"] else "false"


          def _extract_order_id(query, parsed_order_id):
              if parsed_order_id:
                  return str(parsed_order_id).strip()
              match = re.search(r"OD\d{12}", query or "")
              if match:
                  return match.group(0)
              return ""


          def _extract_candidate(query, order_id):
              if order_id:
                  return order_id
              q = query or ""
              if "忘了订单号" in q or "没有订单号" in q or "没订单号" in q:
                  return ""
              if ("退 1000" in q or "退1000" in q or "赔偿" in q or "补偿" in q) and "订单号" not in q and "OD" not in q:
                  return ""
              for match in ORDER_CANDIDATE_PATTERN.finditer(q):
                  token = match.group(0)
                  if token in ["refund", "query", "order", "abc"] or token.startswith("OD") or token.isdigit():
                      return token
              return ""


          def main(agent_text: str, query: str) -> dict:
              parsed = _safe_json(agent_text)
              intent = parsed.get("intent") or _fallback_intent(query)
              if intent not in ["query_order", "refund", "complaint", "chitchat"]:
                  intent = _fallback_intent(query)

              order_id = _extract_order_id(query, parsed.get("order_id", ""))
              candidate = _extract_candidate(query, order_id)
              reason = parsed.get("reason") or ""
              complaint_type = parsed.get("complaint_type") or "售后投诉"
              description = parsed.get("description") or query or ""

              user_emotion = parsed.get("user_emotion") or _fallback_emotion(query)
              if user_emotion not in ["normal", "angry", "urgent"]:
                  user_emotion = _fallback_emotion(query)

              requested_action = parsed.get("requested_action") or _fallback_requested_action(query, intent)
              if requested_action not in ["query", "refund", "complaint", "consult", "compensation", "other"]:
                  requested_action = _fallback_requested_action(query, intent)

              compensation_requested = _bool_text(parsed.get("compensation_requested"), "false")
              if any(k in (query or "") for k in ["赔偿", "补偿", "退 1000", "退1000"]):
                  compensation_requested = "true"

              policy_question = _bool_text(parsed.get("policy_question"), "false")
              if any(k in (query or "") for k in ["能不能退", "政策", "七天无理由", "可以退", "支持退"]):
                  policy_question = "true"

              order_required = intent in ["query_order", "refund", "complaint"]
              order_id_format_valid = bool(ORDER_PATTERN.match(order_id))

              if order_required and not candidate:
                  route = "missing_order"
              elif order_required and not order_id_format_valid:
                  route = "invalid_order"
                  order_id = candidate
              elif intent == "query_order":
                  route = "query_order"
              elif intent == "refund":
                  route = "refund"
              elif intent == "complaint":
                  route = "complaint"
              else:
                  route = "fallback"

              return {
                  "intent": intent,
                  "order_id": order_id,
                  "reason": reason,
                  "complaint_type": complaint_type,
                  "description": description,
                  "user_emotion": user_emotion,
                  "requested_action": requested_action,
                  "compensation_requested": compensation_requested,
                  "policy_question": policy_question,
                  "order_required": "true" if order_required else "false",
                  "order_id_format_valid": "true" if order_id_format_valid else "false",
                  "route": route,
              }
        code_language: python3
