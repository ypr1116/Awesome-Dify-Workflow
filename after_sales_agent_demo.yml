          ORDERS = {
              "OD202605240001": {"status": "已发货", "amount": 299, "product": "无线蓝牙耳机", "can_refund": True},
              "OD202605240002": {"status": "已签收", "amount": 129, "product": "手机壳", "can_refund": True},
              "OD202605240003": {"status": "已签收", "amount": 899, "product": "机械键盘", "can_refund": True},
          }

          def main(order_id: str) -> dict:
              order = ORDERS.get(order_id)
              if not order:
                  return {
                      "status": "未找到",
                      "amount": 0,
                      "product": "",
                      "can_refund": "false",
                      "reply": f"没有查询到订单 {order_id}。请确认订单号是否正确，格式应为 OD + 12 位数字。",
                  }
              can_refund_text = "是" if order["can_refund"] else "否"
              reply = (
                  f"已为你查询订单 {order_id}：\n"
                  f"- 商品：{order['product']}\n"
                  f"- 订单状态：{order['status']}\n"
                  f"- 订单金额：{order['amount']} 元\n"
                  f"- 是否可退款：{can_refund_text}\n\n"
                  "如需退款或投诉，也可以继续告诉我你的诉求。"
              )
              return {
                  "status": order["status"],
                  "amount": order["amount"],
                  "product": order["product"],
                  "can_refund": "true" if order["can_refund"] else "false",
                  "reply": reply,
              }
