        desc: 基于原始 Agent 节点改造：负责意图识别和参数抽取，模拟工具由后续 Workflow 代码节点承接。
        output_schema: null
        plugin_unique_identifier: langgenius/agent:0.0.4@5eb03c08764cc37249f9ef18b89903a99493f6d02c4d5b8ffb40b9f7ef4e865c
        selected: false
        title: Agent：识别售后意图与参数
