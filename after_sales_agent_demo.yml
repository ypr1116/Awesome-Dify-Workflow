    - data:
        code: |
          ORDERS = {
              "OD202605240001": {"status": "已发货", "amount": 299, "product": "无线蓝牙耳机", "can_refund": True},
              "OD202605240002": {"status": "已签收", "amount": 129, "product": "手机壳", "can_refund": True},
              "OD202605240003": {"status": "已签收", "amount": 899, "product": "机械键盘", "can_refund": True},
          }

          def main(order_id: str, reason: str) -> dict:
              order = ORDERS.get(order_id)
              if not order:
                  return {
                      "amount": 0,
                      "can_refund": "false",
                      "need_human_check": "false",
                      "message": f"没有查询到订单 {order_id}，暂时无法申请退款。请核对订单号后重试。",
                      "reply": f"没有查询到订单 {order_id}，暂时无法申请退款。请核对订单号后重试。",
                  }
              amount = order["amount"]
              can_refund = bool(order["can_refund"])
              need_human_check = amount > 500
              if not can_refund:
                  message = "该订单当前不满足退款条件，建议转人工客服进一步确认。"
              elif need_human_check:
                  message = "该订单退款金额超过 500 元，需要人工客服审核。我已为你提交人工审核，请等待客服确认。"
              else:
                  message = f"该订单满足自动退款条件，预计退款金额 {amount} 元。我已为你提交自动退款处理。"

              reason_text = reason.strip() if reason else "未填写"
              reply = (
                  f"退款申请已受理：\n"
                  f"- 订单号：{order_id}\n"
                  f"- 商品：{order['product']}\n"
                  f"- 退款金额：{amount} 元\n"
                  f"- 退款原因：{reason_text}\n"
                  f"- 是否需要人工审核：{'是' if need_human_check else '否'}\n\n"
                  f"{message}"
              )
              return {
                  "amount": amount,
                  "can_refund": "true" if can_refund else "false",
                  "need_human_check": "true" if need_human_check else "false",
                  "message": message,
                  "reply": reply,
              }
        code_language: python3
