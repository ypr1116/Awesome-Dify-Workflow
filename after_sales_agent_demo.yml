              支持意图：
              - query_order：查订单/查物流/到哪了/订单状态
              - refund：申请退款/退钱/退货退款
              - complaint：投诉/抱怨物流慢/服务差/商品问题要投诉
              - chitchat：闲聊或其他咨询

              你需要从用户输入中提取：intent、order_id、reason、complaint_type、description。
              订单号合法格式是 OD + 12 位数字，例如 OD202605240001；但本节点只负责抽取，格式校验由后续 Workflow 完成。

              输出 JSON 格式：
              {"intent":"query_order|refund|complaint|chitchat","order_id":"","reason":"","complaint_type":"","description":""}
